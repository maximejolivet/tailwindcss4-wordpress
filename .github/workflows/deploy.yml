# Deploys this Bedrock site to o2switch over SSH. o2switch restricts SSH
# access with an IP whitelist (cPanel > Security > SSH Access): GitHub
# Actions runners get a different IP on every run, so this workflow
# dynamically whitelists the runner's IP via the cPanel API before
# attempting SSH (see https://faq.o2switch.fr/cpanel/outils/exception-parefeu/).
#
# Required secrets (Settings > Secrets and variables > Actions):
# - DEPLOY_SSH_KEY          SSH private key (dedicated to deployment, not a personal key)
# - DEPLOY_SSH_HOST         loris.o2switch.net
# - DEPLOY_SSH_USER         {{user}} (cPanel username)
# - DEPLOY_PROJECT_PATH     /home/{{user}}/repositories/tailwindcss4-wordpress
# - DEPLOY_CPANEL_PASSWORD  cPanel password — ONLY used for the SSH whitelist
#                           API (port 2083), unrelated to the SSH key above.
#                           Add it yourself via `gh secret set`, never paste
#                           it in chat.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queues overlapping runs instead of letting them race: two concurrent runs
# would interleave whitelist add/remove calls and rsync --delete to the same
# server path. No cancel-in-progress — a run already mid-rsync must finish,
# not get killed halfway through a deploy.
concurrency:
  group: deploy-${{ github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # vendor/ is built here (on the runner) rather than on the server:
      # a fresh checkout has no dev vendor/ to accidentally wipe, unlike a
      # developer's machine running `composer install --no-dev` locally
      # (see .claude/DEPLOY.md §3 for why `make deploy` does the opposite).
      - name: Install PHP dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      # Caches Composer's download cache (~/.composer/cache), not vendor/
      # itself — vendor/ still gets rebuilt fresh every run (--no-dev), but
      # package archives don't get re-downloaded when composer.lock is
      # unchanged.
      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --prefer-dist --no-dev --optimize-autoloader --no-interaction

      # cache: npm + cache-dependency-path avoids re-downloading the theme's
      # node_modules every run when package-lock.json hasn't changed.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/app/themes/custom/tailwind/package-lock.json
      - name: Build theme assets
        run: |
          npm --prefix web/app/themes/custom/tailwind ci
          npm --prefix web/app/themes/custom/tailwind run build

      # Inline instead of a third-party action: haythem/public-ip is
      # unmaintained (last release 2022, still on the deprecated Node 16
      # runtime) and does nothing more than call a public IP echo service.
      - name: Get runner public IP
        id: ip
        run: echo "ipv4=$(curl -sS https://api.ipify.org)" >> "$GITHUB_OUTPUT"

      # o2switch caps the number of whitelisted IPs, and since every run adds
      # a new one and nothing removes old ones on its own, the quota fills up
      # after a few runs and blocks SSH entirely. Uses the JSON list endpoint
      # (?r=list, .data.list[].address) instead of scraping HTML, and removes
      # both `in` and `out` directions for the last 2 entries (o2switch
      # tracks directions separately) before re-adding the current runner IP.
      - name: Whitelist IP on hosting & delete github old ones (o2switch)
        shell: bash
        run: |
          ENDPOINT='frontend/o2switch/o2switch-ssh-whitelist/index.live.php'
          CPANEL="https://${{ secrets.DEPLOY_SSH_USER }}:${{ secrets.DEPLOY_CPANEL_PASSWORD }}@${{ secrets.DEPLOY_SSH_HOST }}:2083"

          echo "Get actual whitelisted IPs..."
          RESPONSE=$(curl -sX GET "$CPANEL/$ENDPOINT?r=list")
          echo "Response: $RESPONSE"
          LAST_IPS=$(echo "$RESPONSE" | jq -r '.data.list[] | .address' | tail -n2)

          for address in $LAST_IPS; do
            echo "Delete this github IP: $address (in & out)"
            curl -sX GET "$CPANEL/$ENDPOINT?r=remove&address=$address&direction=in&port=22" | jq
            sleep 3
            curl -sX GET "$CPANEL/$ENDPOINT?r=remove&address=$address&direction=out&port=22" | jq
            sleep 3
          done

          echo "Attempt to whitelist IP..."
          curl -sX POST -d 'whitelist[address]=${{ steps.ip.outputs.ipv4 }}' -d 'whitelist[port]=22' "$CPANEL/$ENDPOINT?r=add" | jq
          sleep 65

      # Isolates network-level reachability from SSH-specific failures
      # (auth, host key, etc.) when diagnosing a broken run.
      - name: Raw TCP connectivity check (before ssh-agent, no key needed)
        run: |
          echo "Testing TCP connect to ${{ secrets.DEPLOY_SSH_HOST }}:22 ..."
          timeout 10 bash -c 'cat < /dev/null > /dev/tcp/${{ secrets.DEPLOY_SSH_HOST }}/22' \
            && echo "TCP connect OK" \
            || echo "TCP connect FAILED (still blocked, or wrong host/port)"

      # Loads DEPLOY_SSH_KEY into an ssh-agent rather than writing it to a
      # file by hand: a raw `printf '%s' "$SECRET" > keyfile` approach once
      # produced "error in libcrypto" on a perfectly valid key, apparently
      # from subtly mangling the multi-line PEM content. webfactory/ssh-agent
      # loads the secret directly via `ssh-add -`, which doesn't have that
      # problem.
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust the remote host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -v "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts

      # web/app/uploads and web/app/cache are excluded, not just gitignored:
      # --delete would otherwise wipe live media/cache on the server since
      # neither exists in this checkout.
      - name: Rsync to o2switch
        run: |
          rsync -avz --delete \
            --exclude '.git' --exclude '.env' --exclude '.env.deploy*' --exclude 'docker' \
            --exclude '**/node_modules' --exclude '.DS_Store' --exclude '.idea' --exclude '.vscode' \
            --exclude 'web/app/uploads' --exclude 'web/app/cache' \
            ./ "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:${{ secrets.DEPLOY_PROJECT_PATH }}/"
