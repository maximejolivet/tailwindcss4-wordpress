# Déploie ce site Bedrock vers o2switch via SSH. o2switch restreint l'accès
# SSH par liste blanche d'IP (cPanel > Sécurité > Accès SSH) : les runners
# GitHub Actions changent d'IP à chaque exécution, donc ce workflow
# whiteliste dynamiquement l'IP du runner via l'API cPanel avant de tenter le
# SSH (voir https://gist.github.com/webaxones/54a9aee13bd9152e900ef30a0fcef3ed).
#
# Secrets requis (Settings > Secrets and variables > Actions) :
# - DEPLOY_SSH_KEY          clé privée SSH (dédiée au déploiement, pas la clé perso)
# - DEPLOY_SSH_HOST         loris.o2switch.net
# - DEPLOY_SSH_USER         joma2966 (identifiant cPanel)
# - DEPLOY_PROJECT_PATH     /home/joma2966/repositories/tailwindcss4-wordpress
# - DEPLOY_CPANEL_PASSWORD  mot de passe cPanel — UNIQUEMENT pour l'API de
#                           whitelist SSH (port 2083), sans rapport avec la clé
#                           SSH ci-dessus. À ajouter toi-même via `gh secret
#                           set`, jamais collé en clair dans le chat.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PHP dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: composer install --prefer-dist --no-dev --optimize-autoloader --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build theme assets
        run: |
          npm --prefix web/app/themes/custom/tailwind ci
          npm --prefix web/app/themes/custom/tailwind run build

      - name: Get runner public IP
        id: ip
        uses: haythem/public-ip@v1.3

      - name: Whitelist runner IP for SSH (o2switch)
        run: |
          CPANEL="https://${{ secrets.DEPLOY_SSH_USER }}:${{ secrets.DEPLOY_CPANEL_PASSWORD }}@${{ secrets.DEPLOY_SSH_HOST }}:2083"

          echo "--- Removing existing whitelist entries (o2switch caps the number of entries) ---"
          curl -sS "$CPANEL/frontend/o2switch/o2switch-ssh-whitelist/index.live.php" \
            | grep -oE 'index\.live\.php\?r=remove&address=[0-9a-zA-Z%.:_-]+' \
            | sort -u \
            | while read -r removeLink; do
                echo "Removing: $removeLink"
                curl -sS "$CPANEL/frontend/o2switch/o2switch-ssh-whitelist/$removeLink" > /dev/null
              done

          echo "--- Adding ${{ steps.ip.outputs.ipv4 }} to the SSH whitelist ---"
          http_code=$(curl -sS -o /tmp/whitelist-response.html -w '%{http_code}' -X POST \
            -d 'whitelist[address]=${{ steps.ip.outputs.ipv4 }}' \
            -d 'whitelist[port]=22' \
            "$CPANEL/frontend/o2switch/o2switch-ssh-whitelist/index.live.php?r=add")
          echo "HTTP status: $http_code"
          echo "--- Response body (first 2000 chars) ---"
          head -c 2000 /tmp/whitelist-response.html
          echo ""
          echo "--- Current whitelist (fetched right after) ---"
          curl -sS "$CPANEL/frontend/o2switch/o2switch-ssh-whitelist/index.live.php" | grep -oE '[0-9]{1,3}(\.[0-9]{1,3}){3}' | sort -u || true
          sleep 65

      - name: Raw TCP connectivity check (before ssh-agent, no key needed)
        run: |
          echo "Testing TCP connect to ${{ secrets.DEPLOY_SSH_HOST }}:22 ..."
          timeout 10 bash -c 'cat < /dev/null > /dev/tcp/${{ secrets.DEPLOY_SSH_HOST }}/22' \
            && echo "TCP connect OK" \
            || echo "TCP connect FAILED (still blocked, or wrong host/port)"

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust the remote host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -v "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync to o2switch
        run: |
          rsync -avz --delete \
            --exclude '.git' --exclude '.env' --exclude '.env.deploy*' --exclude 'docker' \
            --exclude '**/node_modules' --exclude '.DS_Store' --exclude '.idea' --exclude '.vscode' \
            --exclude 'web/app/uploads' --exclude 'web/app/cache' \
            ./ "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:${{ secrets.DEPLOY_PROJECT_PATH }}/"
