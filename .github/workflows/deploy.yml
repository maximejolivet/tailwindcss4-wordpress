# Deploys this Bedrock site to o2switch over SSH. o2switch restricts SSH
# access with an IP whitelist (cPanel > Security > SSH Access): GitHub
# Actions runners get a different IP on every run, so this workflow clears
# and re-whitelists the runner's IP via the documented SshWhitelist UAPI
# module before attempting SSH (see
# https://faq.o2switch.fr/cpanel/outils/exception-parefeu/ and
# https://faq.o2switch.fr/cpanel/securite/token-api-cpanel/ for the token).
#
# Required secrets (Settings > Secrets and variables > Actions):
# - DEPLOY_SSH_KEY          SSH private key (dedicated to deployment, not a personal key)
# - DEPLOY_SSH_HOST         loris.o2switch.net
# - DEPLOY_SSH_USER         {{user}} (cPanel username)
# - DEPLOY_PROJECT_PATH     /home/{{user}}/repositories/tailwindcss4-wordpress
# - DEPLOY_CPANEL_TOKEN     cPanel API token — ONLY used for the SSH whitelist
#                           UAPI (port 2083), unrelated to the SSH key above.
#                           Create it in cPanel > Security > Manage API Tokens
#                           (see https://faq.o2switch.fr/cpanel/securite/token-api-cpanel/),
#                           then add it yourself via `gh secret set`, never
#                           paste it in chat.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # vendor/ is built here (on the runner) rather than on the server:
      # a fresh checkout has no dev vendor/ to accidentally wipe, unlike a
      # developer's machine running `composer install --no-dev` locally
      # (see .claude/deploy.md §3 for why `make deploy` does the opposite).
      - name: Install PHP dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: composer install --prefer-dist --no-dev --optimize-autoloader --no-interaction

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Build theme assets
        run: |
          npm --prefix web/app/themes/custom/tailwind ci
          npm --prefix web/app/themes/custom/tailwind run build

      # Inline instead of a third-party action: haythem/public-ip is
      # unmaintained (last release 2022, still on the deprecated Node 16
      # runtime) and does nothing more than call a public IP echo service.
      - name: Get runner public IP
        id: ip
        run: echo "ipv4=$(curl -sS https://api.ipify.org)" >> "$GITHUB_OUTPUT"

      # o2switch caps the number of whitelisted IPs, and since every run adds
      # a new one and nothing removed old ones, the quota used to fill up
      # and block SSH entirely. Uses the documented UAPI SshWhitelist module
      # (token auth) instead of scraping the whitelist UI page: reliable
      # (no HTML-format guessing) and lets us just wipe + re-add every run.
      # See https://faq.o2switch.fr/cpanel/securite/token-api-cpanel/ for
      # creating the token and https://faq.o2switch.fr/cpanel/outils/exception-parefeu/
      # for the SshWhitelist module itself.
      - name: Whitelist runner IP for SSH (o2switch)
        run: |
          CPANEL="https://${{ secrets.DEPLOY_SSH_HOST }}:2083"
          AUTH="cpanel ${{ secrets.DEPLOY_SSH_USER }}:${{ secrets.DEPLOY_CPANEL_TOKEN }}"
          IP="${{ steps.ip.outputs.ipv4 }}"

          echo "--- Clearing existing SSH whitelist entries ---"
          curl -sS -m 45 -H "Authorization: $AUTH" "$CPANEL/execute/SshWhitelist/remove_all" | jq

          echo "--- Adding $IP to the SSH whitelist ---"
          curl -sS -m 45 -H "Authorization: $AUTH" "$CPANEL/execute/SshWhitelist/add?address=$IP&port=22" | jq

          echo "--- Current whitelist (fetched right after) ---"
          curl -sS -m 45 -H "Authorization: $AUTH" "$CPANEL/execute/SshWhitelist/list" | jq
          sleep 65

      # Isolates network-level reachability from SSH-specific failures
      # (auth, host key, etc.) when diagnosing a broken run.
      - name: Raw TCP connectivity check (before ssh-agent, no key needed)
        run: |
          echo "Testing TCP connect to ${{ secrets.DEPLOY_SSH_HOST }}:22 ..."
          timeout 10 bash -c 'cat < /dev/null > /dev/tcp/${{ secrets.DEPLOY_SSH_HOST }}/22' \
            && echo "TCP connect OK" \
            || echo "TCP connect FAILED (still blocked, or wrong host/port)"

      # Loads DEPLOY_SSH_KEY into an ssh-agent rather than writing it to a
      # file by hand: a raw `printf '%s' "$SECRET" > keyfile` approach once
      # produced "error in libcrypto" on a perfectly valid key, apparently
      # from subtly mangling the multi-line PEM content. webfactory/ssh-agent
      # loads the secret directly via `ssh-add -`, which doesn't have that
      # problem.
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust the remote host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -v "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts

      # web/app/uploads and web/app/cache are excluded, not just gitignored:
      # --delete would otherwise wipe live media/cache on the server since
      # neither exists in this checkout.
      - name: Rsync to o2switch
        run: |
          rsync -avz --delete \
            --exclude '.git' --exclude '.env' --exclude '.env.deploy*' --exclude 'docker' \
            --exclude '**/node_modules' --exclude '.DS_Store' --exclude '.idea' --exclude '.vscode' \
            --exclude 'web/app/uploads' --exclude 'web/app/cache' \
            ./ "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:${{ secrets.DEPLOY_PROJECT_PATH }}/"
