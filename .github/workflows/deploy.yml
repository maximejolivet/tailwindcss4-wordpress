# Deploys this Bedrock site to o2switch over SSH. o2switch restricts SSH
# access with an IP whitelist (cPanel > Security > SSH Access): GitHub
# Actions runners get a different IP on every run, so this workflow
# dynamically whitelists the runner's IP via the cPanel API before
# attempting SSH (see https://faq.o2switch.fr/cpanel/outils/exception-parefeu/).
#
# Two jobs, not one long list of steps:
#   build   — checkout, composer install (with dev deps) + Pint/PHPStan/
#             audit, THEN composer install --no-dev to prune back down for
#             the artifact, npm build. No secrets, no SSH. Stages the exact
#             deployable tree (excludes dev-only files) and uploads it as
#             an artifact. Quality checks used to be a separate `quality`
#             job gating this one — merged in because splitting them ran
#             `shivammathur/setup-php` and `composer install` twice in
#             sequence (needs: quality made them strictly sequential
#             anyway, never parallel) for zero benefit beyond a separate
#             checkmark in the UI. Gating behavior is unchanged: if lint/
#             phpstan/audit fail, the job stops before npm build/staging/
#             upload ever run.
#   deploy  — downloads that artifact, whitelists the runner's IP, then
#             rsyncs it to the server over SSH.
# IMPORTANT: the IP whitelist step and the rsync/ssh steps MUST stay in the
# SAME job. Every job gets a fresh runner VM with its own public IP — if
# whitelisting ran in a separate job from the SSH steps, the two would
# almost certainly run from different IPs and every deploy would fail with
# "Permission denied" for no obvious reason.
#
# Required secrets (Settings > Secrets and variables > Actions):
# - DEPLOY_SSH_KEY          SSH private key (dedicated to deployment, not a personal key)
# - DEPLOY_SSH_HOST         {{user}}.o2switch.net
# - DEPLOY_SSH_USER         {{user}} (cPanel username)
# - DEPLOY_PROJECT_PATH     /home/{{user}}/repositories/tailwindcss4-wordpress
# - DEPLOY_CPANEL_PASSWORD  cPanel password — ONLY used for the SSH whitelist
#                           API (port 2083), unrelated to the SSH key above.
#                           Add it yourself via `gh secret set`, never paste
#                           it in chat.
#
# Extras beyond the bare minimum:
# - `workflow_dispatch` takes a `dry_run` boolean input — runs everything
#   (build, whitelist, SSH) but passes `--dry-run` to the final rsync, the
#   CI equivalent of `make deploy-dry-run`. The post-rsync smoke test is
#   skipped on a dry run since the server is never actually touched.
# - `deploy` declares a `production` GitHub environment (Settings >
#   Environments), which gives this workflow a deployment history/URL in
#   the GitHub UI and a place to add protection rules later if ever needed.
# - A smoke test after rsync curls the live site and checks the theme's
#   CSS/JS got enqueued — this specific check would have caught the
#   2026-08-02 outage (dist/.vite/manifest.json silently dropped by
#   upload-artifact) automatically instead of needing a human to notice.
# - IP whitelisting logic lives in .github/scripts/o2switch-whitelist.sh,
#   not inline here — it now fails the job explicitly if the o2switch API
#   reports the whitelist add didn't succeed (e.g. quota full), rather than
#   silently sleeping and letting a later step fail with an opaque SSH
#   "Permission denied".

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (rsync --dry-run, changes nothing on the server — CI equivalent of `make deploy-dry-run`)'
        type: boolean
        default: false

# Queues overlapping runs instead of letting them race: two concurrent runs
# would interleave whitelist add/remove calls and rsync --delete to the same
# server path. No cancel-in-progress — a run already mid-rsync must finish,
# not get killed halfway through a deploy.
concurrency:
  group: deploy-${{ github.ref }}

jobs:
  build:
    name: Build & Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Full install (with dev deps: Pint, PHPStan, stubs) — needed for the
      # quality checks right below. Pruned back to --no-dev further down,
      # once those checks have passed, for what actually ships.
      - name: Set up PHP + install dependencies (with dev, for quality checks)
        uses: ./.github/actions/setup-php-composer
        with:
          composer-args: '--prefer-dist --no-interaction --no-progress'

      - name: Validate composer.json/composer.lock
        run: composer validate --strict --no-check-publish

      - name: Pint — code style
        run: composer lint

      - name: PHPStan — static analysis (level 5)
        run: composer phpstan

      - name: Composer audit — CVE scan
        run: composer audit

      # vendor/ is rebuilt here (on the runner) rather than on the server:
      # a fresh checkout has no dev vendor/ to accidentally wipe, unlike a
      # developer's machine running `composer install --no-dev` locally
      # (see .claude/DEPLOY.md §3 for why `make deploy` does the opposite).
      # Plain `composer install` here, not the composite action again —
      # PHP is already set up from the step above, re-running the action
      # would redundantly re-run shivammathur/setup-php for no reason.
      - name: Prune to production dependencies
        run: composer install --prefer-dist --no-dev --optimize-autoloader --no-interaction

      # cache: npm + cache-dependency-path avoids re-downloading the theme's
      # node_modules every run when package-lock.json hasn't changed.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/app/themes/custom/tailwind/package-lock.json
      - name: Build theme assets
        run: |
          npm --prefix web/app/themes/custom/tailwind ci
          npm --prefix web/app/themes/custom/tailwind run build

      # Stages the exact tree the deploy job will rsync to the server, built
      # with a local (non-destructive, no --delete) rsync copy rather than
      # a raw `cp`, so this exclude list is the single source of truth for
      # "what never leaves the runner" — dev tooling, secrets, node_modules
      # (dist/ is already built, the sources aren't needed on the server).
      # web/app/uploads and web/app/cache are deliberately NOT excluded
      # here — that exclude belongs to the deploy job's rsync --delete
      # instead, see the comment there.
      - name: Stage deployable files
        run: |
          mkdir -p /tmp/site
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude 'docker' \
            --exclude 'phpstan.neon.dist' \
            --exclude '.env' --exclude '.env.*' \
            --exclude '**/node_modules' --exclude '.DS_Store' --exclude '.idea' --exclude '.vscode' \
            ./ /tmp/site/

      # include-hidden-files: upload-artifact excludes dotfiles/dotdirs by
      # default since v4.4 (to avoid accidentally leaking secrets) — Vite
      # writes its manifest to dist/.vite/manifest.json, so without this the
      # artifact silently drops it, the deploy job never receives it, and
      # inc/vite.php's enqueue_vite_assets() finds no manifest and skips
      # enqueuing the theme's CSS/JS entirely (no error, just nothing to
      # find). Confirmed root cause of a live production 2026-08-02 outage.
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: /tmp/site
          retention-days: 1
          include-hidden-files: true

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://wordpress.jolivetmaxime.fr
    permissions:
      contents: read
    steps:
      # This job only ever downloaded the build artifact before, never the
      # source repo — needed now for .github/scripts/o2switch-whitelist.sh
      # to actually exist on the runner (it lives in source control, not
      # in the deployable artifact, which excludes .github/ entirely).
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      # Inline instead of a third-party action: haythem/public-ip is
      # unmaintained (last release 2022, still on the deprecated Node 16
      # runtime) and does nothing more than call a public IP echo service.
      - name: Get runner public IP
        id: ip
        run: echo "ipv4=$(curl -sS https://api.ipify.org)" >> "$GITHUB_OUTPUT"

      # Logic lives in .github/scripts/o2switch-whitelist.sh (uses the JSON
      # list endpoint, ?r=list/.data.list[].address, instead of scraping
      # HTML) — extracted out of the workflow so it's testable/readable on
      # its own, and so it can fail the job explicitly (checks the ?r=add
      # response's .success field) instead of silently sleeping and letting
      # a later SSH step fail with an opaque "Permission denied" when the
      # real cause is the o2switch whitelist quota being full.
      - name: Whitelist IP on hosting & delete github old ones (o2switch)
        env:
          CPANEL_USER: ${{ secrets.DEPLOY_SSH_USER }}
          CPANEL_PASSWORD: ${{ secrets.DEPLOY_CPANEL_PASSWORD }}
          CPANEL_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          RUNNER_IP: ${{ steps.ip.outputs.ipv4 }}
        run: .github/scripts/o2switch-whitelist.sh

      # Replaces a blind `sleep 65` (always paid in full, even when the
      # firewall change propagates in a few seconds) with a poll loop:
      # exits as soon as the port opens, and fails with a clear message
      # instead of proceeding to a cryptic SSH "Permission denied" if it
      # never does within the budget.
      - name: Wait for SSH port to open (post-whitelist propagation)
        run: |
          echo "Waiting for ${{ secrets.DEPLOY_SSH_HOST }}:22 to accept connections..."
          for i in $(seq 1 24); do
            if timeout 5 bash -c 'cat < /dev/null > /dev/tcp/${{ secrets.DEPLOY_SSH_HOST }}/22' 2>/dev/null; then
              echo "TCP connect OK after $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::TCP connect to ${{ secrets.DEPLOY_SSH_HOST }}:22 still failing after 120s — whitelist may not have propagated yet, or host/port is wrong."
          exit 1

      # Loads DEPLOY_SSH_KEY into an ssh-agent rather than writing it to a
      # file by hand: a raw `printf '%s' "$SECRET" > keyfile` approach once
      # produced "error in libcrypto" on a perfectly valid key, apparently
      # from subtly mangling the multi-line PEM content. webfactory/ssh-agent
      # loads the secret directly via `ssh-add -`, which doesn't have that
      # problem.
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust the remote host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -v "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts

      # web/app/uploads, web/app/cache AND .env are excluded here too, not
      # just from the build artifact: --delete removes anything on the
      # server that isn't in the source, and none of these three exist in
      # the artifact (uploads/cache are never populated by the build job;
      # .env is never checked out at all, it's gitignored and only ever
      # exists on the server). Without this exclude here, --delete wipes
      # the live .env on every deploy — this is not hypothetical, it's
      # exactly what happened on the first run of this split pipeline.
      #
      # The 'P' (protect) filter keeps previously deployed dist/assets/*
      # files from being removed by --delete: Vite content-hashes every
      # filename, so each deploy ships new hashed files without touching
      # old ones, but --delete would otherwise remove the old ones in the
      # same pass that overwrites manifest.json/index.php — any visitor
      # whose page still references the old hash (loaded just before or
      # during the deploy) would get a 404 on their CSS/JS. Orphaned old
      # hashes just accumulate in dist/assets/ (small, immutable,
      # cache-busted) instead of being deleted.
      - name: Rsync to o2switch
        run: |
          rsync -avz --delete ${{ inputs.dry_run && '--dry-run' || '' }} \
            --filter='P web/app/themes/custom/tailwind/dist/assets/**' \
            --exclude 'web/app/uploads' --exclude 'web/app/cache' \
            --exclude '.env' --exclude '.env.*' \
            site/ "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:${{ secrets.DEPLOY_PROJECT_PATH }}/"

      # Would have caught the 2026-08-02 outage automatically (dist/.vite/
      # manifest.json silently dropped by upload-artifact, inc/vite.php
      # skipped enqueuing the theme's CSS/JS with no error) instead of
      # relying on a human noticing the site looked unstyled. Skipped on a
      # dry run — rsync --dry-run doesn't touch the server, so the live
      # site's HTML wouldn't reflect this run either way.
      - name: Smoke test — verify the theme's CSS/JS are enqueued
        if: ${{ !inputs.dry_run }}
        run: |
          for i in 1 2 3; do
            HTML=$(curl -skf "https://wordpress.jolivetmaxime.fr/?smoke_test=$(date +%s)") && break
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          if ! echo "$HTML" | grep -q 'dist/assets/'; then
            echo "::error::Homepage HTML has no reference to dist/assets/ — the theme's CSS/JS may not be enqueued (see inc/vite.php: enqueue_vite_assets() silently returns if dist/.vite/manifest.json is missing or unreadable)."
            exit 1
          fi
          echo "Smoke test OK: dist/assets/ reference found in the homepage HTML."
