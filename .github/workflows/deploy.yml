# Deploys this Bedrock site to o2switch over SSH. o2switch restricts SSH
# access with an IP whitelist (cPanel > Security > SSH Access): GitHub
# Actions runners get a different IP on every run, so this workflow
# dynamically whitelists the runner's IP via the cPanel API before
# attempting SSH (see https://gist.github.com/webaxones/54a9aee13bd9152e900ef30a0fcef3ed).
#
# Required secrets (Settings > Secrets and variables > Actions):
# - DEPLOY_SSH_KEY          SSH private key (dedicated to deployment, not a personal key)
# - DEPLOY_SSH_HOST         loris.o2switch.net
# - DEPLOY_SSH_USER         {{user}} (cPanel username)
# - DEPLOY_PROJECT_PATH     /home/{{user}}/repositories/tailwindcss4-wordpress
# - DEPLOY_CPANEL_PASSWORD  cPanel password — ONLY used for the SSH whitelist
#                           API (port 2083), unrelated to the SSH key above.
#                           Add it yourself via `gh secret set`, never paste
#                           it in chat.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # vendor/ is built here (on the runner) rather than on the server:
      # a fresh checkout has no dev vendor/ to accidentally wipe, unlike a
      # developer's machine running `composer install --no-dev` locally
      # (see .claude/deploy.md §3 for why `make deploy` does the opposite).
      - name: Install PHP dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: composer install --prefer-dist --no-dev --optimize-autoloader --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build theme assets
        run: |
          npm --prefix web/app/themes/custom/tailwind ci
          npm --prefix web/app/themes/custom/tailwind run build

      - name: Get runner public IP
        id: ip
        uses: haythem/public-ip@v1.3

      # o2switch caps the number of whitelisted IPs. Since every run adds a
      # new one and nothing removes old ones on its own, the quota eventually
      # fills up and blocks SSH entirely (API replies HTTP 200 with
      # {"success":false,"message":"...limite d'exceptions autorisées..."}).
      # Rather than sweeping every entry on every run (which would also nuke
      # a developer's own manually-whitelisted IP used for `make deploy`),
      # try the add first and only remove one entry — the last one found on
      # the whitelist page — if it fails on the quota, then retry.
      - name: Whitelist runner IP for SSH (o2switch)
        run: |
          CPANEL="https://${{ secrets.DEPLOY_SSH_USER }}:${{ secrets.DEPLOY_CPANEL_PASSWORD }}@${{ secrets.DEPLOY_SSH_HOST }}:2083"
          IP="${{ steps.ip.outputs.ipv4 }}"

          add_ip() {
            curl -sS -o /tmp/whitelist-response.html -w '%{http_code}' -X POST \
              -d "whitelist[address]=$IP" \
              -d 'whitelist[port]=22' \
              "$CPANEL/frontend/o2switch/o2switch-ssh-whitelist/index.live.php?r=add"
          }

          remove_last_entry() {
            last_entry=$(curl -sS "$CPANEL/frontend/o2switch/o2switch-ssh-whitelist/index.live.php?r=list" \
              | jq -c '[.. | objects | select(has("address"))] | last')
            last_ip=$(echo "$last_entry" | jq -r '.address // empty')
            last_port=$(echo "$last_entry" | jq -r '.port // 22')
            if [ -n "$last_ip" ]; then
              echo "Whitelist full: removing most recent entry ($last_ip:$last_port)"
              curl -sS "$CPANEL/frontend/o2switch/o2switch-ssh-whitelist/index.live.php?r=remove&address=$last_ip&direction=in&port=$last_port" > /dev/null
              return 0
            fi
            echo "Whitelist full but no removable entry found (list format may have changed)"
            return 1
          }

          echo "--- Adding $IP to the SSH whitelist ---"
          http_code=$(add_ip)
          echo "HTTP status: $http_code"

          attempt=0
          while grep -q '"success":false' /tmp/whitelist-response.html && [ "$attempt" -lt 5 ]; do
            attempt=$((attempt + 1))
            echo "--- Add failed (attempt $attempt) ---"
            cat /tmp/whitelist-response.html
            echo ""
            remove_last_entry || break
            echo "--- Retrying add of $IP ---"
            http_code=$(add_ip)
            echo "HTTP status: $http_code"
          done

          echo "--- Final response body (first 2000 chars) ---"
          head -c 2000 /tmp/whitelist-response.html
          echo ""
          echo "--- Current whitelist (fetched right after) ---"
          curl -sS "$CPANEL/frontend/o2switch/o2switch-ssh-whitelist/index.live.php?r=list" | jq
          sleep 65

      # Isolates network-level reachability from SSH-specific failures
      # (auth, host key, etc.) when diagnosing a broken run.
      - name: Raw TCP connectivity check (before ssh-agent, no key needed)
        run: |
          echo "Testing TCP connect to ${{ secrets.DEPLOY_SSH_HOST }}:22 ..."
          timeout 10 bash -c 'cat < /dev/null > /dev/tcp/${{ secrets.DEPLOY_SSH_HOST }}/22' \
            && echo "TCP connect OK" \
            || echo "TCP connect FAILED (still blocked, or wrong host/port)"

      # Loads DEPLOY_SSH_KEY into an ssh-agent rather than writing it to a
      # file by hand: a raw `printf '%s' "$SECRET" > keyfile` approach once
      # produced "error in libcrypto" on a perfectly valid key, apparently
      # from subtly mangling the multi-line PEM content. webfactory/ssh-agent
      # loads the secret directly via `ssh-add -`, which doesn't have that
      # problem.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust the remote host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -v "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts

      # web/app/uploads and web/app/cache are excluded, not just gitignored:
      # --delete would otherwise wipe live media/cache on the server since
      # neither exists in this checkout.
      - name: Rsync to o2switch
        run: |
          rsync -avz --delete \
            --exclude '.git' --exclude '.env' --exclude '.env.deploy*' --exclude 'docker' \
            --exclude '**/node_modules' --exclude '.DS_Store' --exclude '.idea' --exclude '.vscode' \
            --exclude 'web/app/uploads' --exclude 'web/app/cache' \
            ./ "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:${{ secrets.DEPLOY_PROJECT_PATH }}/"